<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lotería</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-image: url('https://assets.cdn.filesafe.space/orLNFmqquwQDs4QXcbfS/media/6a7663859a9c7792eaedcd11.png');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .btn {
      padding: 15px 30px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background-color: #d32f2f;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }
    .btn:hover {
      background-color: #b71c1c;
    }
  </style>
</head>
<body>
  <a href="https://champi.cool/etik" class="btn">Jugar a la Lotería</a>
</body>
</html>
