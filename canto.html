<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cantar Lotería - Irregular Verbs</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff3b3b;
            --secondary: #2ecc71;
            --dark: #2c3e50;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
            background: repeating-linear-gradient(
                45deg,
                #92d8e7,
                #92d8e7 20px,
                #5dcae2 20px,
                #5dcae2 40px
            );
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--dark);
        }

        /* Pantalla de inicio */
        #start-screen {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 85%;
            max-width: 400px;
        }

        #start-screen h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-top: 0;
        }

        /* Pantalla principal de juego */
        #game-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 600px;
            padding: 10px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        /* Estadísticas / Contador */
        .stats-bar {
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .stats-bar span {
            color: var(--primary);
        }

        /* Contenedor de la carta */
        .card-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0; /* Permite que la imagen se reduzca en pantallas chicas */
        }

        #current-card-img {
            max-width: 100%;
            max-height: 40vh; /* Ocupa máximo el 40% de la altura de la pantalla */
            object-fit: contain;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background-color: white;
            border: 5px solid white;
            transition: transform 0.3s;
        }

        /* Zona de texto (La oración) */
        .sentence-box {
            background: white;
            padding: 15px 20px;
            border-radius: 15px;
            text-align: center;
            font-size: clamp(1.2rem, 5vw, 1.6rem);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            margin: 15px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }

        .blank-space {
            border-bottom: 3px solid var(--dark);
            display: inline-block;
            min-width: 60px;
            margin: 0 5px;
        }

        .revealed-verb {
            color: var(--secondary);
            font-weight: 600;
            text-transform: uppercase;
            text-decoration: underline;
            margin: 0 5px;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Controles inferiores */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 10px;
            width: 100%;
            padding-bottom: 10px;
        }

        .btn {
            border: none;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 15px 5px;
            color: white;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.2);
        }

        .btn:disabled {
            background-color: #a0a0a0 !important;
            box-shadow: 0 5px 0 #7a7a7a !important;
            cursor: not-allowed;
            transform: none;
        }

        .btn-prev { background-color: #f39c12; box-shadow: 0 5px 0 #d68910; }
        .btn-reveal { background-color: var(--secondary); box-shadow: 0 5px 0 #27ae60; }
        .btn-next { background-color: var(--primary); box-shadow: 0 5px 0 #c0392b; }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div id="start-screen">
        <h1>¡Cantar Lotería!</h1>
        <p style="font-size: 1.2rem;">Simple Past Irregular Verbs</p>
        <button class="btn btn-next" style="width: 100%; margin-top: 20px; font-size: 1.3rem;" onclick="startGame()">Comenzar a Cantar</button>
    </div>

    <!-- Pantalla del Juego -->
    <div id="game-screen">
        
        <!-- Contador -->
        <div class="stats-bar">
            <div>Tarjeta: <span id="current-count">0</span>/64</div>
            <div>Faltan: <span id="remaining-count">64</span></div>
        </div>

        <!-- Carta -->
        <div class="card-container">
            <img id="current-card-img" src="" alt="Tarjeta de Lotería">
        </div>

        <!-- Oración -->
        <div class="sentence-box" id="sentence-display">
            <!-- El texto se inyecta por JS -->
        </div>

        <!-- Controles -->
        <div class="controls">
            <button class="btn btn-prev" id="btn-prev" onclick="prevCard()">⬅️ Atrás</button>
            <button class="btn btn-reveal" id="btn-reveal" onclick="revealVerb()">Descubrir</button>
            <button class="btn btn-next" id="btn-next" onclick="nextCard()">Siguiente ➡️</button>
        </div>
    </div>

    <script>
        // Base de datos completa con las 64 cartas, oraciones y respuestas.

            { id: 14, img: "https://files.catbox.moe/1qzd29.png", sent: "She _________ a beautiful new dress for the party.", verb: "bought" },
            { id: 15, img: "https://files.catbox.moe/0fidjy.png", sent: "They _________ delicious snacks to the meeting.", verb: "brought" },
            { id: 16, img: "https://files.catbox.moe/nzt0ym.png", sent: "I _________ all your letters in a secret box.", verb: "kept" },

            { id: 23, img: "https://files.catbox.moe/ozom8i.png", sent: "I _________ very happy when I received the news.", verb: "felt" },

            { id: 52, img: "https://files.catbox.moe/hbhyc9.png", sent: "He _________ near the door waiting for the bus.", verb: "stood" },
            { id: 53, img: "https://files.catbox.moe/2qig1u.png", sent: "I _________ a lot of photos during the concert.", verb: "took" },
            { id: 54, img: "https://files.catbox.moe/n1vltb.png", sent: "The teacher _________ us an interesting story.", verb: "told" },
            { id: 55, img: "https://files.catbox.moe/lvcjzf.png", sent: "She _________ a long letter to her best friend.", verb: "wrote" },
            { id: 56, img: "https://files.catbox.moe/yi4nkn.png", sent: "They _________ very happy with the results.", verb: "were" },
            { id: 57, img: "https://files.catbox.moe/ic1ybg.png", sent: "The small caterpillar _________ a beautiful butterfly.", verb: "became" },
            { id: 58, img: "https://files.catbox.moe/71tig7.png", sent: "The movie _________ ten minutes late.", verb: "began" },
            { id: 59, img: "https://files.catbox.moe/sq4jaf.png", sent: "Someone _________ the window with a rock.", verb: "broke" },
            { id: 60, img: "https://files.catbox.moe/xa26az.png", sent: "He _________ an umbrella because it was raining.", verb: "brought" },
            { id: 61, img: "https://files.catbox.moe/ev2s63.png", sent: "The workers _________ the new bridge in six months.", verb: "built" },
            { id: 62, img: "https://files.catbox.moe/ome9ud.png", sent: "We _________ some fresh fruit at the market.", verb: "bought" },
            { id: 63, img: "https://files.catbox.moe/gzagpq.png", sent: "The cat _________ a small mouse in the garden.", verb: "caught" },
            { id: 64, img: "https://files.catbox.moe/85vwvz.png", sent: "She _________ the yellow team for the game.", verb: "chose" }
        ];

        let playHistory = []; // Aquí guardaremos el orden de las cartas aleatorias
        let currentIndex = -1; // Índice actual en la historia

        function startGame() {
            // Revolver las cartas aleatoriamente
            let shuffled = [...deckData];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            
            // Añadir propiedad 'isRevealed' a cada carta
            playHistory = shuffled.map(card => ({ ...card, isRevealed: false }));
            currentIndex = 0;

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            updateUI();
        }

        function updateUI() {
            const card = playHistory[currentIndex];
            
            // Actualizar la Imagen
            document.getElementById('current-card-img').src = card.img;

            // Actualizar el Texto
            const textContainer = document.getElementById('sentence-display');
            if (card.isRevealed) {
                textContainer.innerHTML = card.sent.replace("_________", `<span class="revealed-verb">${card.verb}</span>`);
            } else {
                textContainer.innerHTML = card.sent.replace("_________", `<span class="blank-space"></span>`);
            }

            // Actualizar Contadores
            document.getElementById('current-count').innerText = (currentIndex + 1);
            document.getElementById('remaining-count').innerText = (playHistory.length - (currentIndex + 1));

            // Actualizar estado de los botones
            document.getElementById('btn-prev').disabled = (currentIndex === 0);
            document.getElementById('btn-reveal').disabled = card.isRevealed;
            
            if (currentIndex === playHistory.length - 1) {
                document.getElementById('btn-next').innerText = "Terminar";
                document.getElementById('btn-next').style.backgroundColor = "#8e44ad"; 
            } else {
                document.getElementById('btn-next').innerText = "Siguiente ➡️";
                document.getElementById('btn-next').style.backgroundColor = "var(--primary)"; 
            }
        }

        function revealVerb() {
            playHistory[currentIndex].isRevealed = true;
            updateUI();
        }

        function nextCard() {
            if (currentIndex < playHistory.length - 1) {
                currentIndex++;
                updateUI();
            } else {
                alert("¡Se acabaron las cartas! Juego terminado.");
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        }
    </script>
</body>
</html>
