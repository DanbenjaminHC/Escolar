<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lotería Virtual</title>
    <!-- Fuente divertida y legible de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ff3b3b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif; /* Usando la fuente divertida */
            /* Patrón de líneas diagonales con los dos azules solicitados */
            background: repeating-linear-gradient(
                45deg,
                #92d8e7,
                #92d8e7 20px,
                #5dcae2 20px,
                #5dcae2 40px
            );
            /* Evita que se pueda scrollear, todo cabe en la pantalla */
            height: 100dvh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            color: #333;
        }

        /* Pantalla de inicio */
        #login-screen {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 85%;
            max-width: 350px;
        }

        #login-screen h1 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 2.5rem;
        }

        #name-input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 3px solid #5dcae2;
            border-radius: 12px;
            font-size: 1.2rem;
            font-family: 'Fredoka', sans-serif;
            box-sizing: border-box;
            outline: none;
            text-align: center;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-family: 'Fredoka', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 0 #cc2e2e; /* Efecto botón 3D */
        }
        
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #cc2e2e;
        }

        /* Pantalla de juego */
        #game-screen {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 15px 10px;
            box-sizing: border-box;
        }

        /* Título superior */
        #player-title {
            font-size: clamp(1.8rem, 7vw, 2.8rem);
            color: #ffffff;
            /* Contorno negro para que resalte sobre el fondo azul */
            -webkit-text-stroke: 2px #2c3e50;
            text-shadow: 3px 3px 0px #2c3e50;
            margin: 10px 0 5px 0;
            text-align: center;
            line-height: 1.1;
        }

        /* Contenedor del tablero (ajusta el tamaño automático) */
        #board-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 0; /* Crucial para que no desborde en flexbox */
        }

        /* Tablero 4x4 */
        #board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 6px;
            /* Esta magia hace que sea cuadrado y quepa en CUALQUIER celular sin salirse */
            width: 95vw;
            height: 95vw;
            max-width: 65vh; 
            max-height: 65vh;
            background: rgba(255, 255, 255, 0.4);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .card {
            background-color: white; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
        }

        /* Tachar carta */
        .card.marked::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.45);
            border-radius: 8px;
        }

        .card.marked::before {
            content: '❌';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(1.8rem, 7vw, 3rem);
            z-index: 2;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.6));
        }

        /* Texto inferior */
        #footer-text {
            font-size: clamp(1.1rem, 5vw, 1.5rem);
            color: #ffffff;
            -webkit-text-stroke: 1.5px #2c3e50;
            text-shadow: 2px 2px 0px #2c3e50;
            margin: 5px 0 15px 0;
            text-align: center;
        }

        /* Modal de Victoria */
        #win-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        #win-modal h2 {
            font-size: 3.5rem;
            margin: 0;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #win-modal p {
            font-size: 2rem;
            margin-top: 10px;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Pantalla de inicio -->
    <div id="login-screen">
        <h1>¡Lotería!</h1>
        <input type="text" id="name-input" placeholder="Escribe tu nombre..." autocomplete="off">
        <button class="btn" onclick="startGame()">¡JUGAR!</button>
    </div>

    <!-- Pantalla de juego -->
    <div id="game-screen">
        <div id="player-title">Lotería de <span id="p-name"></span></div>
        
        <div id="board-container">
            <div id="board"></div>
        </div>

        <div id="footer-text">Lotería Simple past irregular verbs</div>
    </div>

    <!-- Mensaje de victoria -->
    <div id="win-modal">
        <h2>¡LOTERÍA!</h2>
        <p id="win-message-text"></p>
        <button class="btn" style="width: auto; margin-top: 30px; background-color: white; color: #ff3b3b;" onclick="location.reload()">Jugar de nuevo</button>
    </div>

    <!-- Audio -->
    <audio id="bg-music" src="https://assets.cdn.filesafe.space/orLNFmqquwQDs4QXcbfS/media/6a7660dd7a46c6dc51b79db5.mp3" loop preload="auto"></audio>

    <script>
        const cardUrls = [
            "https://files.catbox.moe/ll9zq6.png", "https://files.catbox.moe/imci9o.png", "https://files.catbox.moe/2wix8i.png", 
            "https://files.catbox.moe/kx4qwd.png", "https://files.catbox.moe/jhm2u1.png", "https://files.catbox.moe/updh0u.png", 
            "https://files.catbox.moe/mfcmip.png", "https://files.catbox.moe/70nsn9.png", "https://files.catbox.moe/55c2m6.png", 
            "https://files.catbox.moe/jde5y5.png", "https://files.catbox.moe/8yzrtl.png", "https://files.catbox.moe/hbhyc9.png", 
            "https://files.catbox.moe/2qig1u.png", "https://files.catbox.moe/n1vltb.png", "https://files.catbox.moe/lvcjzf.png", 
            "https://files.catbox.moe/yi4nkn.png", "https://files.catbox.moe/ic1ybg.png", "https://files.catbox.moe/71tig7.png", 
            "https://files.catbox.moe/sq4jaf.png", "https://files.catbox.moe/xa26az.png", "https://files.catbox.moe/ev2s63.png", 
            "https://files.catbox.moe/ome9ud.png", "https://files.catbox.moe/gzagpq.png", "https://files.catbox.moe/85vwvz.png", 
            "https://files.catbox.moe/kwxgsq.png", "https://files.catbox.moe/ispuo2.png", "https://files.catbox.moe/rr7qzw.png", 
            "https://files.catbox.moe/fe7oj6.png", "https://files.catbox.moe/wcncjc.png", "https://files.catbox.moe/9efqwy.png", 
            "https://files.catbox.moe/1qzd29.png", "https://files.catbox.moe/0fidjy.png", "https://files.catbox.moe/nzt0ym.png", 
            "https://files.catbox.moe/a1cb98.png", "https://files.catbox.moe/bn6pu4.png", "https://files.catbox.moe/36t1x6.png", 
            "https://files.catbox.moe/zeb359.png", "https://files.catbox.moe/p75ba0.png", "https://files.catbox.moe/w4j2zq.png", 
            "https://files.catbox.moe/ozom8i.png", "https://files.catbox.moe/b53bt0.png", "https://files.catbox.moe/b4rcu7.png", 
            "https://files.catbox.moe/33f123.png", "https://files.catbox.moe/xffeal.png", "https://files.catbox.moe/8nf3io.png", 
            "https://files.catbox.moe/3jblob.png", "https://files.catbox.moe/omtb6n.png", "https://files.catbox.moe/n481uz.png", 
            "https://files.catbox.moe/mck8vv.png", "https://files.catbox.moe/dl689t.png", "https://files.catbox.moe/kd1sbe.png", 
            "https://files.catbox.moe/a2ephp.png", "https://files.catbox.moe/es7cfb.png", "https://files.catbox.moe/8g91ni.png", 
            "https://files.catbox.moe/1axce8.png", "https://files.catbox.moe/ex2uqe.png", "https://files.catbox.moe/rjnhg8.png", 
            "https://files.catbox.moe/j6nukf.png", "https://files.catbox.moe/qq3u36.png", "https://files.catbox.moe/c2hj9l.png", 
            "https://files.catbox.moe/3br3yw.png", "https://files.catbox.moe/wnrfsk.png", "https://files.catbox.moe/phb7up.png", 
            "https://files.catbox.moe/dipx8w.png"
        ];

        let playerName = "";
        let markedCards = 0;

        function startGame() {
            const input = document.getElementById('name-input').value.trim();
            if (input === "") {
                alert("Por favor, ingresa tu nombre.");
                return;
            }
            
            playerName = input;
            
            // Inyectar nombre en el título
            document.getElementById('p-name').innerText = playerName;
            
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            const audio = document.getElementById('bg-music');
            audio.volume = 0.5;
            audio.play().catch(error => console.log("Bloqueado autoplay de audio."));

            generateBoard();
        }

        function generateBoard() {
            let shuffled = [...cardUrls];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const selectedCards = shuffled.slice(0, 16);
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = ''; 

            selectedCards.forEach(url => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.style.backgroundImage = `url('${url}')`;
                
                cardDiv.addEventListener('click', function() {
                    if (!this.classList.contains('marked')) {
                        this.classList.add('marked');
                        markedCards++;
                        checkWin();
                    } else {
                        this.classList.remove('marked');
                        markedCards--;
                    }
                });

                boardElement.appendChild(cardDiv);
            });
        }

        function checkWin() {
            if (markedCards === 16) {
                setTimeout(() => {
                    document.getElementById('win-message-text').innerText = `¡Ganaste ${playerName}!`;
                    document.getElementById('win-modal').style.display = 'flex';
                }, 300);
            }
        }
    </script>
</body>
</html>
